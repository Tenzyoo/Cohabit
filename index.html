<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2667f5">
  <title>合住 · 合租生活管家</title>
  <meta name="description" content="四个人，一个家。点击家里的空间，轻松处理共享账单、值日排班、公共物品和室友公约。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232667f5'/%3E%3Cpath d='M7 15L16 7l9 8v10H7z' fill='white'/%3E%3Crect x='13' y='18' width='6' height='7' rx='1' fill='%232667f5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script src="./model.js" defer></script><script src="./app.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="./" aria-label="合住首页"><span class="brand-mark" data-icon="home"></span><span>合住<small>一起住，好好过</small></span></a>
    <div class="house-name"><span class="house-emoji">301</span><div><strong>梧桐路的小家</strong><small>4 位室友 · 四室一厅</small></div></div>
    <nav aria-label="主导航">
      <button class="nav-item active" data-open="home"><span data-icon="home"></span>我的家</button>
      <button class="nav-item" data-open="bills"><span data-icon="wallet"></span>共享账单<span class="nav-count" id="bill-count"></span></button>
      <button class="nav-item" data-open="cleaning"><span data-icon="sparkles"></span>清洁值日</button>
      <button class="nav-item" data-open="items"><span data-icon="package"></span>公共物品<span class="nav-count warm" id="item-count"></span></button>
      <button class="nav-item" data-open="pacts"><span data-icon="clipboard"></span>室友公约</button>
    </nav>
    <div class="sidebar-bottom"><span data-icon="heart"></span><p>生活的小事，<br>一起分担就好。</p><span class="demo-label">演示房间 · 无需登录</span><button class="text-button" id="reset-demo">重置体验数据</button></div>
  </aside>
  <div class="main-wrap">
    <header class="topbar"><div class="breadcrumb">我的家 <span>/</span> 梧桐路 301</div><div class="top-actions"><span class="local-hint">体验数据保存在本机</span><label class="identity"><span class="avatar tiny" id="top-avatar"></span><select id="identity-select" aria-label="切换室友身份"></select><span data-icon="chevron"></span></label></div></header>
    <main>
      <div class="greeting"><div><div class="eyebrow" id="date-label"></div><h1>回家啦，<span id="greeting-name"></span><span class="sun-icon" data-icon="sun"></span></h1><p>点击家里的空间，处理今天的小事。</p></div><div class="home-badge"><span data-icon="users"></span><strong>四个人，一个家</strong></div></div>
      <section class="summary" aria-label="我的待办概览" id="summary"></section>
      <div class="home-layout">
        <section class="house-card" aria-label="可点击的合租小家">
          <div class="house-card-head"><div><span class="blue-line"></span><strong>我们的小家</strong><span class="subtle">HOME SWEET HOME</span></div><span class="map-hint"><span data-icon="pointer"></span>试试点击空间</span></div>
          <div class="house-scene" id="house-scene">
            <img id="house-image" src="./assets/apartment.webp" alt="四室一厅的立体小家，中央客厅连接厨房、玄关和四位室友的卧室" width="1536" height="1024">
            <div class="scene-tag">301 <span>·</span> 梧桐路的小家</div>
            <button class="hotspot room room-a" data-person="lin"><span class="avatar" data-avatar="lin"></span><span>小林的房间</span></button>
            <button class="hotspot room room-b" data-person="ze"><span class="avatar" data-avatar="ze"></span><span>阿泽的房间</span></button>
            <button class="hotspot room room-c" data-person="xia"><span class="avatar" data-avatar="xia"></span><span>小夏的房间</span></button>
            <button class="hotspot room room-d" data-person="zhou"><span class="avatar" data-avatar="zhou"></span><span>周周的房间</span></button>
            <button class="hotspot action-hotspot kitchen" data-open="items"><span class="hotspot-icon orange" data-icon="package"></span><span><strong>厨房 · 公共物品</strong><small id="kitchen-hint"></small></span><b id="kitchen-badge"></b></button>
            <button class="hotspot action-hotspot living" data-open="cleaning"><span class="hotspot-icon blue" data-icon="sparkles"></span><span><strong>客厅 · 清洁值日</strong><small id="living-hint"></small></span></button>
            <button class="hotspot action-hotspot entry" data-open="bills"><span class="hotspot-icon purple" data-icon="wallet"></span><span><strong>玄关 · 共享账单</strong><small id="entry-hint"></small></span></button>
            <button class="hotspot action-hotspot board" data-open="pacts"><span class="hotspot-icon green" data-icon="clipboard"></span><span><strong>公告墙 · 室友公约</strong><small id="board-hint"></small></span></button>
          </div>
          <div class="roommates-bar"><span>今天以谁的身份回家？</span><div id="roommate-buttons"></div></div>
        </section>
        <aside class="daily-panel"><section class="today-card"><div class="section-title"><h2>我的小事</h2><span class="small-pill" id="todo-number"></span></div><div id="todo-list"></div><div class="all-clear" id="all-clear" hidden><span data-icon="check"></span>今天的小事都处理好啦</div></section><section class="activity-card"><div class="section-title"><h2>家的动态</h2><span data-icon="activity"></span></div><div id="activity-list"></div></section><div class="home-note"><span data-icon="heart"></span><p>把钱算清，把事分好。<br>留点时间，一起好好生活。</p></div></aside>
      </div>
    </main>
    <footer><span>合住 · 让合租更轻松</span><span>功能雏形 · 可切换室友体验协作流程</span></footer>
  </div>
  <dialog class="drawer" id="drawer" aria-labelledby="drawer-title"><div class="drawer-top"><div><div class="eyebrow" id="drawer-location"></div><h2 id="drawer-title"></h2></div><button class="icon-button" id="close-drawer" aria-label="关闭面板"><span data-icon="close"></span></button></div><div class="drawer-tabs" id="drawer-tabs"></div><div class="drawer-identity"><span>当前室友</span><label class="identity"><span id="drawer-avatar" class="avatar tiny"></span><select id="drawer-identity-select" aria-label="在功能面板切换室友身份"></select><span data-icon="chevron"></span></label></div><div class="drawer-content" id="drawer-content"></div></dialog>
  <dialog class="confirm-dialog" id="confirm-dialog" aria-labelledby="confirm-title"><h2 id="confirm-title">重新体验这个家？</h2><p>将清除本浏览器中的演示操作，恢复四位室友的示例数据。</p><div class="button-row"><button class="secondary" id="cancel-reset">保留数据</button><button class="primary" id="confirm-reset">恢复示例</button></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body></html>
